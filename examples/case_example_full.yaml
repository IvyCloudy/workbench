- testcase_id: TC_DEEP_NEST_010
  testCaseNo: TT17826550143091004
  path: 深层功能/嵌套场景/安全/
  name: 安全注入与XSS防护
  type: 安全测试
  preconditions:
    - WAF已开启
  priority: 高
  steps:
    - id: 1
      operation: 提交SQL注入payload
      data:
        - "' OR 1=1 --"
        - admin'--
        - 1; DROP TABLE users
      ui_expected:
        - 输入校验失败提示
      api_expected:
        - HTTP状态码: 400
        - code: 40002
          message: 非法字符
      db_expected:
        - 数据表未受影响
    - id: 2
      operation: 提交XSS payload
      data:
        - <script>alert('xss')</script>
        - <img src=x onerror=alert(1)>
        - javascript:alert(1)
      ui_expected:
        - 渲染时被转义为纯文本
        - 不触发alert弹窗
      api_expected:
        - 响应内容已转义
      db_expected:
        - 存储内容已转义保存
- testcase_id: TC_DEEP_NEST_011
  testCaseNo: TT17826550093371010
  path: 深层功能/嵌套场景/事务/
  name: 跨表事务回滚
  type: 功能测试
  preconditions:
    - 数据库支持事务
  priority: 中
  steps:
    - id: 1
      operation: 业务执行中第二步抛异常
      data:
        - steps:
            - table: t_order
              op: insert
            - table: t_stock
              op: update
              will_fail: true
      ui_expected:
        - 提示: 操作失败，请重试
      api_expected:
        - HTTP状态码: 500
        - code: 50001
      db_expected:
        - t_order无新增
        - t_stock无变化
        - 事务已回滚
