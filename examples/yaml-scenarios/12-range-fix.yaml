# ============================================================================
# 场景 12：多行选中修复（Range Fix）
# ----------------------------------------------------------------------------
# 期望：
#   · 全文件共约 3 个"问题簇"（A/B/C 段），分布在互不相邻的行段；
#   · 用户选中某一段（如仅选 B 段），Quick Fix 菜单应出现：
#       🔧 修复选中范围（第 X~Y 行，共 N 处）
#     且执行后只修该段落，A/C 段保持原样。
#   · 各段之间预留 5+ 行"正常"内容分隔，便于精确选中。
# ----------------------------------------------------------------------------
# 触发条件（YamlFixProvider）：
#   1) 选区跨多行  2) 选区内可修复数 >= 2  3) 选区内可修复数 < 全量数
# ============================================================================

# ---------- A 段：R4 冒号缺空格集群 ----------
segment_a:
  name:alpha
  version:1.0
  port:8080
  host:127.0.0.1
  scheme:http

# ---------- 分隔（正常内容） ----------
divider_1:
  desc: "everything ok here"
  count: 100
  enabled: "true"

# ---------- B 段：R5 歧义值集群 ----------
segment_b:
  flag1: yes
  flag2: no
  flag3: On
  flag4: OFF
  fallback: null
  ratio: NaN

# ---------- 分隔（正常内容） ----------
divider_2:
  desc: "another ok section"
  count: 200
  enabled: "false"

# ---------- C 段：R8 dash 空格 + R3 行末空格集群 ----------
segment_c:
  tags:
    -foo
    -bar
    -baz
  notes: hello world   
  extra: value  
  more: content    

# ---------- 尾部正常 ----------
tail:
  finished: "true"
  timestamp: "2024-06-01T10:30:00Z"
