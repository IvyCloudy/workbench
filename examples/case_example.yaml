- testcase_id: 案例唯一标识，不可修改
  path: 功能条目/测试要点/
  name: 案例名称
  description: 案例描述
  preconditions:
    - 案例前置条件
  steps:
    - id: 1
      operation: 步骤名称1
      data:
        - 步骤数据1
        - 步骤数据2
      ui_expected:
        - UI检查点1
        - UI检查点2
      api_expected:
        - API检查点1
        - API检查点2
      db_expected:
        - 数据库检查点1
        - 数据库检查点2
    - id: 2
      operation: 步骤名称2
      data:
        - 步骤数据1
        - 步骤数据2
      ui_expected:
        - UI检查点1
        - UI检查点2
      api_expected:
        - API检查点1
      db_expected:
        - 数据库检查点1
        - 数据库检查点2
  type: 功能点类/流程类/界面类...
  test_type: 手工/自动化
  priority: 高/中/低