# ============================================================================
# 场景 07：R6 · 值中出现 # 号（会被 YAML 当注释吞掉）
# ----------------------------------------------------------------------------
# 期望：`key: value #tag` 且 # 前是空格 → 整个值被后半段"注释"吃掉。
#       修复策略：整个值加双引号。
# 注意：紧贴（无空格）的 `#` 不算注释，不应误报；引号内的 # 也不应误报。
# ============================================================================
notes:
  hash1: label #tag
  hash2: my #note
  hash3: value #with hash
  server: srv #prod

# 合法样例，不应误报
hex:
  color1: "#FF0000"
  color2: "#00FF00"
tight:
  a: value#tag
  b: "#literal"
