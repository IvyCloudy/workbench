# ---------- Section 5.5: 保留字段/歧义关键字全家桶 ----------
# 目标：把 yamlConstants.ts 中 BOOLEAN / NULL / NUMERIC_SPECIAL 集合以及
# RESERVED_CHARS_PATTERN 的每个字符都单独覆盖到，方便回归定位。
reserved_keywords:
  # R5 布尔关键字全集（未加引号）
  bool_true_lower: "true"
  bool_false_lower: "false"
  bool_true_upper: "TRUE"
  bool_false_upper: "FALSE"
  bool_true_cap: "True"
  bool_false_cap: "False"
  bool_yes_lower: "yes"
  bool_no_lower: "no"
  bool_yes_upper: "YES"
  bool_no_upper: "NO"
  bool_yes_cap: "Yes"
  bool_no_cap: "No"
  bool_on_lower: "on"
  bool_off_lower: "off"
  bool_on_upper: "ON"
  bool_off_upper: "OFF"
  bool_on_cap: "On"
  bool_off_cap: "Off"
  # R5 null 关键字全集
  null_lower: "null"
  null_upper: "NULL"
  null_cap: "Null"
  null_tilde: "~"
  # R5 特殊数值全集
  num_inf_lower: ".inf"
  num_nan_lower: ".nan"
  num_inf_upper: ".INF"
  num_nan_upper: ".NAN"
  num_infinity: "Infinity"
  num_neg_infinity: "-Infinity"

reserved_chars:
  # R7 每个保留字符单独示例
  bracket_open: "a[b"
  bracket_close: "a]b"
  brace_open: "a{b"
  brace_close: "a}b"
  comma_only: "a,b,c,d"
  anchor_amp: "value&anchor"
  alias_star: "value*ref"
  tag_bang: "value!type"
  fold_gt: "value>next"
  literal_pipe: "value|next"
  # 保留字符组合：同时命中多规则
  mixed_1: "{a:1,b:[c,d]}                    # R7 { [ , }"
  mixed_2: "!tag &anchor *alias >fold |lit    # R7 ! & * > |"

# ---------- Section 5.6: 特殊结构 / 内嵌 JSON ----------
# 目标：验证插件对"合法但危险"的写法能否给出正确诊断/修复
# 注意：本章节所有"有问题"用例都必须能通过 R5/R6/R7 兜底修复，
# 不能引入无法收敛的 parse error（会破坏 mega-batch 收敛断言）。
json_inline:
  # 单行 JSON 对象作值（未加引号 → R7 { , }）
  jo_simple: '{"name":"tom","age":18}'
  jo_bool: '{"enabled":true,"count":10}'
  jo_nested: '{"user":{"id":1,"tags":["a","b"]},"active":true}'
  jo_array: '[1,2,3,{"k":"v"}]'
  # 值内既是 JSON 又含 # → R6 + R7 组合
  jo_with_hash: '{"note":"a tag inside"} extra #comment'
  # JSON 字符串中含冒号 → R7 { 命中
  jo_with_colon: '{"url":"https://a.com/x?y=1"}'
  # JSON 数组含 URL/特殊字符
  ja_urls: '["https://a.com","https://b.com?q=1&r=2"]'
  # 已用引号包裹的 JSON（合法示例，不应命中 R7）
  jo_quoted_ok: '{"name":"tom","age":18}'
  ja_quoted_ok: "[1,2,3]"

flow_edge:
  # 嵌套 flow（合法 —— 不应误报）
  deep_flow_ok: '{"a":{"b":{"c":{"d":1}}}}'
  # flow 里带保留字符（未引号 → R7 命中）
  flow_reserved: "{tag:type, ref:anchor, ptr:alias}"

block_scalars:
  # 块标量头本身合法，内容里的 # 在 block scalar 中不会被视为注释
  literal_ok: "|"
    # [indent mismatch] line-1
    # [indent mismatch] line-2 has #hash but ok in block scalar
  folded_ok: ">"
    # [indent mismatch] this is a folded block
    #hash also ok here
  # 带修饰符的块标量
  literal_strip: "|-"
    # [indent mismatch] strip-trailing-newline
  folded_keep: ">+"
    # [indent mismatch] keep-trailing-newline

anchor_alias_ok:
  # 锚点与别名（合法用法 —— 不应误报）
  base: "&base_1"
    # [indent mismatch] host: example.com
    # [indent mismatch] port: 443
  derived: "*base_1"

yaml_tags_ok:
  # YAML 内置标签（!!str / !!int / !!bool —— yaml lib 可识别）
  as_str: "!!str 12345"
  as_int: '!!int "42"'
  as_bool: '!!bool "true"'

multiline_strings_ok:
  # 折叠 / 保留换行（合法）
  desc_folded: ">-"
    # [indent mismatch] This is a long description
    # [indent mismatch] that folds into a single line.
  desc_literal: "|-"
    # [indent mismatch] line-A
    # [indent mismatch] line-B

embedded_scripts:
  # 脚本片段作值（含大量保留字符、# 等 —— 建议加引号，规则可自动修复）
  bash_cmd: "if [ -z X ]; then echo empty; fi"
  js_expr: "const arr = [1,2,3]; arr.map(x => x*2);"
  regex_val: "pattern &value *ref !type"
  json_pointer: /users/0/name

# ---------- Section 6: 尾部合法内容（不应被误报） ----------
trailing_ok:
  quoted_yes: "yes"
  quoted_brace: "{a:1}"
  quoted_hash: "value #with hash"
  numeric_ok: 12345
  ip_ok: "192.168.1.1"
  url_ok: "https://example.com/path?a=1&b=2"

