<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src ${cspSource} https: data: blob:; style-src ${cspSource} 'unsafe-inline'; script-src ${cspSource} 'nonce-${nonce}';">
<title>测试大纲 · 思维导图</title>
<link rel="stylesheet" href="${vendorStyleUri}">
<link rel="stylesheet" href="${styleLayoutUri}">
<link rel="stylesheet" href="${stylePanelsUri}">
<link rel="stylesheet" href="${stylePopupsUri}">
</head>
<body>
<div class="mm-app">
  <div class="mm-toolbar">
    <div class="mm-tool-left">
      <span class="mm-title">📌 <span id="mmFileName" class="mm-filename" title="" role="button" tabindex="0">point.md</span></span>
      <button class="mm-hint-btn" id="mmHintBtn" type="button" title="查看快捷键" aria-label="查看快捷键" data-tip="查看快捷键">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.8.4-1 .9-1 1.7"></path>
          <circle cx="12" cy="17" r="0.7" fill="currentColor"></circle>
        </svg>
      </button>
      <div class="mm-hint-popover hidden" id="mmHintPopover" role="dialog" aria-label="快捷键说明">
        <div class="mm-hint-pop-title">快捷键</div>
        <ul class="mm-hint-pop-list">
          <li><kbd>双击</kbd> 编辑节点</li>
          <li><kbd>Tab</kbd> 添加子节点</li>
          <li><kbd>Enter</kbd> 添加同级节点</li>
          <li><kbd>Delete</kbd> 删除节点</li>
          <li><kbd>右键</kbd> 查看完整菜单</li>
          <li><kbd>滚轮</kbd> 缩放画布</li>
          <li><kbd>空白拖动</kbd> 平移画布</li>
        </ul>
      </div>
    </div>
    <!-- 中间功能按钮区：保持视觉居中（左侧文件名宽度变化时不影响居中位置） -->
    <div class="mm-tool-center">
      <!-- 分组 1：节点编辑（添加子 / 同级） -->
      <div class="mm-btn-group" role="group" aria-label="节点编辑">
        <button class="mm-btn mm-btn--icon" id="btnAddChild" title="添加子节点（Tab）" aria-label="添加子节点" data-tip="添加子节点 (Tab)">
          <!-- 父节点（左上小方块） + L 形折线 + 子节点（右下圆角矩形） -->
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="6" height="5" rx="1.2"></rect>
            <path d="M6 9v5.5a1.5 1.5 0 0 0 1.5 1.5H11"></path>
            <rect x="11" y="12" width="10" height="8" rx="1.6"></rect>
            <path d="M16 14.5v3M14.5 16h3"></path>
          </svg>
        </button>
        <button class="mm-btn mm-btn--icon" id="btnAddSibling" title="添加同级节点（Enter）" aria-label="添加同级节点" data-tip="添加同级节点 (Enter)">
          <!-- 左侧小圆点（已有节点的代理）+ 短横线 + 右侧圆角矩形（新同级） -->
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="5" cy="12" r="1.6" fill="currentColor" stroke="none"></circle>
            <line x1="7" y1="12" x2="11" y2="12"></line>
            <rect x="11" y="8" width="10" height="8" rx="1.6"></rect>
            <path d="M16 10.5v3M14.5 12h3"></path>
          </svg>
        </button>
      </div>

      <!-- 分组 2：视图（展开 / 折叠 / 适应） -->
      <div class="mm-btn-group" role="group" aria-label="视图">
        <button class="mm-btn mm-btn--icon" id="btnExpandAll" title="全部展开" aria-label="全部展开" data-tip="全部展开">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2"></rect>
            <path d="M12 8v8M8 12h8"></path>
          </svg>
        </button>
        <button class="mm-btn mm-btn--icon" id="btnCollapseAll" title="全部折叠" aria-label="全部折叠" data-tip="全部折叠">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2"></rect>
            <path d="M8 12h8"></path>
          </svg>
        </button>
        <button class="mm-btn mm-btn--icon" id="btnFit" title="自适应缩放（按 0）" aria-label="自适应" data-tip="自适应缩放 (0)">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 9V5h4"></path>
            <path d="M20 9V5h-4"></path>
            <path d="M4 15v4h4"></path>
            <path d="M20 15v4h-4"></path>
          </svg>
        </button>
      </div>

      <!-- 分组 3：导出 / 文本视图 -->
      <div class="mm-btn-group" role="group" aria-label="导出">
        <button class="mm-btn mm-btn--icon mm-btn--accent" id="btnExportXmind" title="导出 .xmind" aria-label="导出 XMind" data-tip="导出 .xmind 文件">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 4v11"></path>
            <path d="M7.5 10.5L12 15l4.5-4.5"></path>
            <path d="M5 18.5h14"></path>
          </svg>
        </button>
        <button class="mm-btn mm-btn--icon" id="btnOpenText" title="切换为 Markdown 文本编辑" aria-label="文本视图" data-tip="切换为 Markdown 文本编辑">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="4" width="16" height="16" rx="1.6"></rect>
            <path d="M8 9h8M8 12.5h8M8 16h5"></path>
          </svg>
        </button>
      </div>
    </div>
    <!-- 右侧占位：与左侧弹性宽度相等，确保 .mm-tool-center 始终视觉居中 -->
    <div class="mm-tool-right" aria-hidden="true"></div>
  </div>
  <div class="mm-canvas" id="mmCanvas">
    <div class="mm-mindmap" id="mmContainer"></div>
    <div class="mm-empty" id="mmEmpty">加载中…</div>

    <!-- 右侧浮动工具条（参考 ProcessOn） -->
    <div class="mm-side-rail" id="mmSideRail" role="toolbar" aria-label="节点工具">
      <button class="mm-rail-btn" data-rail="theme" aria-label="主题样式" data-tip="主题样式">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <line x1="4" y1="7" x2="20" y2="7"></line>
          <circle cx="9" cy="7" r="2.2" fill="var(--mm-toolbar-bg)"></circle>
          <line x1="4" y1="17" x2="20" y2="17"></line>
          <circle cx="15" cy="17" r="2.2" fill="var(--mm-toolbar-bg)"></circle>
        </svg>
      </button>
      <button class="mm-rail-btn" data-rail="layout" aria-label="切换布局" data-tip="切换布局">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="3" width="6" height="4" rx="0.8"></rect>
          <rect x="3" y="15" width="6" height="4" rx="0.8"></rect>
          <rect x="9" y="15" width="6" height="4" rx="0.8"></rect>
          <rect x="15" y="15" width="6" height="4" rx="0.8"></rect>
          <path d="M12 7v3M6 15v-2h12v2"></path>
        </svg>
      </button>
      <button class="mm-rail-btn" data-rail="emoji" aria-label="插入图标" data-tip="插入图标">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <circle cx="12" cy="12" r="9"></circle>
          <circle cx="9" cy="10" r="0.9" fill="currentColor"></circle>
          <circle cx="15" cy="10" r="0.9" fill="currentColor"></circle>
          <path d="M8.5 14.5c1 1.4 2.2 2 3.5 2s2.5-.6 3.5-2"></path>
        </svg>
      </button>
      <button class="mm-rail-btn" data-rail="image" aria-label="插入图片" data-tip="插入图片">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5" width="18" height="14" rx="1.6"></rect>
          <circle cx="8.5" cy="10" r="1.4"></circle>
          <path d="M3 17l5-5 4 4 3-3 6 6"></path>
        </svg>
      </button>
      <button class="mm-rail-btn" data-rail="more" aria-label="更多功能" data-tip="更多功能">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="4" width="6" height="6" rx="1"></rect>
          <rect x="14" y="4" width="6" height="6" rx="1"></rect>
          <rect x="4" y="14" width="6" height="6" rx="1"></rect>
          <rect x="14" y="14" width="6" height="6" rx="1"></rect>
        </svg>
      </button>
    </div>

    <!-- 样式面板（Tab：Page Style / Topic Style，对照 ProcessOn） -->
    <div class="mm-style-panel hidden" id="mmStylePanel" role="dialog" aria-label="样式面板">
      <div class="mm-sp-head">
        <div class="mm-sp-tabs">
          <button class="mm-sp-tab is-active" data-tab="page">页面样式</button>
          <button class="mm-sp-tab" data-tab="topic">节点样式</button>
        </div>
        <button class="mm-sp-close" id="mmSpClose" title="关闭" aria-label="关闭">✕</button>
      </div>

      <!-- Topic Style：节点样式 -->
      <div class="mm-sp-body" id="mmSpBodyTopic">
        <div class="mm-sp-empty hidden" id="mmSpTopicEmpty">请先选中节点再编辑节点样式</div>

        <div class="mm-sp-section">
          <div class="mm-sp-section-title">文字</div>

          <div class="mm-sp-row mm-sp-row-2">
            <div class="mm-sp-field"><select class="mm-sp-input" id="spFontFamily" data-style="fontFamily">
              <option value='-apple-system, "Helvetica Neue", Arial, "Source Han Sans", "PingFang SC", "Microsoft YaHei", sans-serif'>Source Han Sans</option>
              <option value='Arial, sans-serif'>Arial</option>
              <option value='"Times New Roman", serif'>Times New Roman</option>
              <option value='"Courier New", monospace'>Courier New</option>
              <option value='"Microsoft YaHei", sans-serif'>微软雅黑</option>
              <option value='"PingFang SC", sans-serif'>苹方</option>
              <option value='SimSun, serif'>宋体</option>
            </select></div>
            <div class="mm-sp-field mm-sp-color-field">
              <input type="color" class="mm-sp-color" id="spColor" data-style="color" />
              <span class="mm-sp-color-caret">▾</span>
            </div>
          </div>

          <div class="mm-sp-row mm-sp-row-2">
            <div class="mm-sp-stepper">
              <button class="mm-sp-step" data-step="-1" data-target="spFontSize">−</button>
              <input type="number" id="spFontSize" data-style="fontSize" min="8" max="80" value="14" />
              <button class="mm-sp-step" data-step="1" data-target="spFontSize">+</button>
              <span class="mm-sp-step-suffix">px</span>
            </div>
            <div class="mm-sp-iconbtns">
              <button class="mm-sp-toggle" id="spBold"        data-style="fontWeight"     data-on="bold"      data-off="normal" title="加粗"><b>B</b></button>
              <button class="mm-sp-toggle" id="spItalic"      data-style="fontStyle"      data-on="italic"    data-off="normal" title="斜体"><i>I</i></button>
              <button class="mm-sp-toggle" id="spUnderline"   data-style="textDecoration" data-on="underline" data-off="none"   title="下划线"><span style="text-decoration:underline;">U</span></button>
              <button class="mm-sp-toggle" id="spStrike"      data-style="textDecoration" data-on="line-through" data-off="none" title="删除线"><span style="text-decoration:line-through;">S</span></button>
            </div>
          </div>

          <div class="mm-sp-row mm-sp-row-2">
            <div class="mm-sp-iconbtns">
              <button class="mm-sp-iconbtn" data-align="left"   title="左对齐">
                <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><line x1="2" y1="4" x2="14" y2="4"/><line x1="2" y1="8" x2="9" y2="8"/><line x1="2" y1="12" x2="12" y2="12"/></svg>
              </button>
              <button class="mm-sp-iconbtn" data-align="center" title="居中">
                <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><line x1="2" y1="4" x2="14" y2="4"/><line x1="4" y1="8" x2="12" y2="8"/><line x1="3" y1="12" x2="13" y2="12"/></svg>
              </button>
              <button class="mm-sp-iconbtn" data-align="right"  title="右对齐">
                <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><line x1="2" y1="4" x2="14" y2="4"/><line x1="7" y1="8" x2="14" y2="8"/><line x1="4" y1="12" x2="14" y2="12"/></svg>
              </button>
            </div>
            <div class="mm-sp-iconbtns mm-sp-iconbtns--right">
              <button class="mm-sp-iconbtn" data-tba="tight"   title="紧凑行距"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4"><line x1="3" y1="5" x2="13" y2="5"/><line x1="3" y1="8" x2="13" y2="8"/><line x1="3" y1="11" x2="13" y2="11"/></svg></button>
              <button class="mm-sp-iconbtn" data-tba="loose"   title="宽松行距"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4"><line x1="3" y1="3" x2="13" y2="3"/><line x1="3" y1="8" x2="13" y2="8"/><line x1="3" y1="13" x2="13" y2="13"/></svg></button>
            </div>
          </div>
        </div>

        <div class="mm-sp-section">
          <div class="mm-sp-section-title mm-sp-section-title--with-action">
            <span>形状</span>
            <button type="button" class="mm-sp-shape-trigger" id="spShapeTrigger" title="选择节点形状">
              <svg class="mm-sp-shape-trigger-icon" viewBox="0 0 28 14" width="28" height="14" aria-hidden="true">
                <rect x="1" y="1" width="26" height="12" rx="6" ry="6" fill="none" stroke="currentColor" stroke-width="1.4"/>
              </svg>
              <svg class="mm-sp-shape-trigger-caret" viewBox="0 0 10 6" width="10" height="6" aria-hidden="true">
                <path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>

          <!-- 填充：复选 + 颜色（渐变色暂未启用，先隐藏占位） -->
          <div class="mm-sp-row mm-sp-row-2">
            <label class="mm-sp-check">
              <input type="checkbox" id="spFillEnable" /> 填充
            </label>
            <div class="mm-sp-field mm-sp-color-field">
              <input type="color" class="mm-sp-color" id="spFillColor" data-style="fillColor" />
              <span class="mm-sp-color-caret">▾</span>
            </div>
            <!-- 渐变色占位：未启用前不展示，避免给用户造成功能损坏的错觉
            <div class="mm-sp-field mm-sp-color-field" title="渐变色（暂未启用）" hidden>
              <input type="color" class="mm-sp-color" id="spFillGradient" disabled />
              <span class="mm-sp-color-caret">▾</span>
            </div>
            -->
          </div>

          <!-- 边框：复选 + 线型 + 颜色 -->
          <div class="mm-sp-row mm-sp-row-3">
            <label class="mm-sp-check">
              <input type="checkbox" id="spBorderEnable" /> 边框
            </label>
            <div class="mm-sp-field"><select class="mm-sp-input" id="spBorderDash" data-style="borderDashed">
              <option value="none">───</option>
              <option value="dashed">─ ─ ─</option>
              <option value="dotted">· · ·</option>
            </select></div>
            <div class="mm-sp-field mm-sp-color-field">
              <input type="color" class="mm-sp-color" id="spBorderColor" data-style="borderColor" />
              <span class="mm-sp-color-caret">▾</span>
            </div>
          </div>

          <!-- 边框宽度 -->
          <div class="mm-sp-row mm-sp-row-1">
            <div class="mm-sp-stepper mm-sp-stepper--wide">
              <button class="mm-sp-step" data-step="-1" data-target="spBorderWidth">−</button>
              <input type="number" id="spBorderWidth" data-style="borderWidth" min="0" max="20" step="0.5" value="2" />
              <button class="mm-sp-step" data-step="1" data-target="spBorderWidth">+</button>
              <span class="mm-sp-step-suffix">px</span>
            </div>
          </div>

          <!-- 固定宽度 -->
          <div class="mm-sp-row mm-sp-row-2">
            <label class="mm-sp-check">
              <input type="checkbox" id="spFixedWEnable" /> 固定宽度
            </label>
            <div class="mm-sp-stepper mm-sp-stepper--wide">
              <button class="mm-sp-step" data-step="-1" data-target="spFixedW">−</button>
              <input type="number" id="spFixedW" data-style="textAutoWrapWidth" min="80" max="800" value="195" />
              <button class="mm-sp-step" data-step="1" data-target="spFixedW">+</button>
              <span class="mm-sp-step-suffix">px</span>
            </div>
          </div>
        </div>

        <div class="mm-sp-section">
          <div class="mm-sp-section-title">连线</div>

          <div class="mm-sp-row mm-sp-row-2">
            <div class="mm-sp-field">
              <select class="mm-sp-input" id="spLineStyle" data-theme="lineStyle">
                <option value="curve">曲线</option>
                <option value="straight">直线</option>
                <option value="direct">直连</option>
              </select>
            </div>
            <div class="mm-sp-field mm-sp-connect-end">
              <select class="mm-sp-input" id="spConnectEnd">
                <option value="none">⊣</option>
                <option value="arrow">→</option>
                <option value="dot">⦿</option>
              </select>
            </div>
          </div>

          <div class="mm-sp-row mm-sp-row-3">
            <div class="mm-sp-field">
              <select class="mm-sp-input" id="spLineDash" data-theme="lineDasharray">
                <option value="none">───</option>
                <option value="5,5">─ ─ ─</option>
                <option value="2,4">· · ·</option>
              </select>
            </div>
            <div class="mm-sp-field"><span class="mm-sp-text-muted">───</span></div>
            <div class="mm-sp-field mm-sp-color-field">
              <input type="color" class="mm-sp-color" id="spLineColor" data-theme="lineColor" />
              <span class="mm-sp-color-caret">▾</span>
            </div>
          </div>

          <div class="mm-sp-row mm-sp-row-1">
            <div class="mm-sp-stepper mm-sp-stepper--wide">
              <button class="mm-sp-step" data-step="-1" data-target="spLineWidth">−</button>
              <input type="number" id="spLineWidth" data-theme="lineWidth" min="0" max="20" step="0.5" value="2" />
              <button class="mm-sp-step" data-step="1" data-target="spLineWidth">+</button>
              <span class="mm-sp-step-suffix">px</span>
            </div>
          </div>

          <div class="mm-sp-row mm-sp-row-2">
            <div class="mm-sp-label">编号</div>
            <div class="mm-sp-field">
              <select class="mm-sp-input" id="spNumber">
                <option value="none">无</option>
                <option value="1.">1.</option>
                <option value="A.">A.</option>
                <option value="(1)">(1)</option>
              </select>
            </div>
          </div>
        </div>

        <div class="mm-sp-section">
          <div class="mm-sp-section-title">预设主题样式</div>
          <div class="mm-sp-presets" id="mmSpPresets"></div>
        </div>

        <div class="mm-sp-section">
          <button class="mm-sp-reset" id="mmSpReset">重置样式</button>
        </div>
      </div>

      <!-- Page Style：整体样式 -->
      <div class="mm-sp-body hidden" id="mmSpBodyPage">
        <div class="mm-sp-section">
          <div class="mm-sp-section-title">骨架</div>
          <button type="button" class="mm-sp-skeleton-card" id="spSkeletonCard" title="点击切换布局">
            <div class="mm-sp-skeleton-label" id="spSkeletonLabel">基础思维导图</div>
            <div class="mm-sp-skeleton-thumb" id="spSkeletonThumb"></div>
            <svg class="mm-sp-skeleton-caret" width="10" height="6" viewBox="0 0 10 6" aria-hidden="true">
              <path d="M1 1l4 4 4-4" stroke="#86909C" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <!-- 兼容老逻辑保留隐藏 select -->
          <select class="mm-sp-input" id="spLayout" hidden></select>
        </div>

        <div class="mm-sp-section">
          <div class="mm-sp-section-title">方向</div>
          <div class="mm-sp-row mm-sp-row-1">
            <select class="mm-sp-input" id="spDirection">
              <option value="logicalStructure">向右</option>
              <option value="logicalStructureLeft">向左</option>
              <option value="mindMap">双向</option>
            </select>
          </div>
        </div>

        <div class="mm-sp-section">
          <div class="mm-sp-section-title">配色</div>
          <div class="mm-sp-colorbar">
            <div class="mm-sp-colorbar-strip" id="spPalette"></div>
            <button class="mm-sp-colorbar-mode" id="spColorModeBtn" type="button">
              <span class="mm-sp-colorbar-mode-label" id="spColorModeLabel">动态对比</span>
              <svg width="10" height="6" viewBox="0 0 10 6" aria-hidden="true">
                <path d="M1 1l4 4 4-4" stroke="#86909C" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <div class="mm-sp-palette-menu" id="spPaletteMenu" hidden></div>
          </div>
          <div class="mm-sp-theme-grid" id="spThemeGrid"></div>
        </div>

        <div class="mm-sp-section">
          <div class="mm-sp-section-title">背景</div>
          <div class="mm-sp-row mm-sp-row-2">
            <div class="mm-sp-field">
              <select class="mm-sp-input" id="spBgKind">
                <option value="color">纯色</option>
                <option value="transparent">透明</option>
              </select>
            </div>
            <div class="mm-sp-field mm-sp-color-field">
              <input type="color" class="mm-sp-color" id="spBgColor" />
              <span class="mm-sp-color-caret">▾</span>
            </div>
          </div>
        </div>

        <div class="mm-sp-section">
          <div class="mm-sp-section-title">布局</div>
          <label class="mm-sp-check mm-sp-check--block">
            <input type="checkbox" id="spSameLevelAlign" /> 同级节点对齐
          </label>
          <label class="mm-sp-check mm-sp-check--block">
            <input type="checkbox" id="spHideRoot" /> 隐藏中心主题
          </label>
          <div class="mm-sp-row mm-sp-row-2">
            <div class="mm-sp-label">节点间距</div>
            <div class="mm-sp-field">
              <select class="mm-sp-input" id="spTopicSpacing">
                <option value="compact">紧凑</option>
                <option value="normal" selected>常规</option>
                <option value="loose">宽松</option>
                <option value="custom">自定义</option>
              </select>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 独立 Layout 面板（与 stylePanel 同父级 mmCanvas，确保 top:12px 真正对齐顶部） -->
    <div class="mm-style-panel mm-layout-panel hidden" id="mmLayoutPanel" role="dialog" aria-label="布局面板">
      <div class="mm-sp-head">
        <div class="mm-layout-head-title">布局</div>
        <button class="mm-sp-close" id="mmLayoutClose" title="关闭" aria-label="关闭">✕</button>
      </div>
      <div class="mm-sp-body">
        <div class="mm-sp-section">
          <div class="mm-sp-layout-groups" id="layoutGroupsPanel"></div>
        </div>
      </div>
    </div>
  </div>
  <div class="mm-statusbar" id="mmStatus">就绪</div>

  <!-- 插入下拉菜单（隐藏） -->
  <div class="mm-insert-menu hidden" id="mmInsertMenu" role="menu">
    <button class="mm-im-item" data-act="emoji">😀<span>插入图标</span></button>
    <button class="mm-im-item" data-act="link">🔗<span>插入链接</span></button>
    <button class="mm-im-item" data-act="image">🖼️<span>插入图片</span></button>
    <button class="mm-im-item" data-act="attachment">📎<span>插入附件</span></button>
  </div>

  <!-- Emoji 选择面板（隐藏） -->
  <div class="mm-emoji-panel hidden" id="mmEmojiPanel" role="dialog" aria-label="选择图标">
    <div class="mm-emoji-head">
      <div class="mm-emoji-title">图标</div>
      <button class="mm-emoji-x" id="mmEmojiClose" title="关闭" aria-label="关闭">✕</button>
    </div>
    <div class="mm-emoji-search">
      <input type="text" id="mmEmojiSearch" placeholder="搜索图标 / 分组（如 priority、emotion）" />
    </div>
    <div class="mm-emoji-body" id="mmEmojiBody"></div>
    <div class="mm-emoji-foot">
      <span class="mm-emoji-tip">已添加的图标再点一次即可取消</span>
      <button class="mm-emoji-clear" id="mmEmojiClear" type="button" title="清除当前节点的全部图标">清除全部图标</button>
    </div>
  </div>

  <!-- 链接输入对话框（隐藏） -->
  <div class="mm-prompt hidden" id="mmLinkPrompt" role="dialog" aria-label="插入链接">
    <div class="mm-prompt-title">插入链接</div>
    <div class="mm-prompt-row">
      <label>链接文本</label>
      <input type="text" id="mmLinkText" placeholder="显示文本（可选，默认用 URL）" />
    </div>
    <div class="mm-prompt-row">
      <label>URL</label>
      <input type="text" id="mmLinkUrl" placeholder="https://..." />
    </div>
    <div class="mm-prompt-actions">
      <button class="mm-btn" id="mmLinkCancel">取消</button>
      <button class="mm-btn mm-btn-primary" id="mmLinkOk">确定</button>
    </div>
  </div>

  <!-- 图片插入对话框（隐藏） -->
  <div class="mm-img-modal hidden" id="mmImagePrompt" role="dialog" aria-label="插入图片">
    <div class="mm-img-header">
      <div class="mm-img-title">插入图片</div>
      <button class="mm-img-close" id="mmImageCancel" title="关闭" aria-label="关闭">✕</button>
    </div>
    <div class="mm-img-tabs" role="tablist">
      <button class="mm-img-tab active" data-tab="local" role="tab">本地图片</button>
      <button class="mm-img-tab" data-tab="web" role="tab">网络图片</button>
    </div>

    <!-- Tab: 本地图片 -->
    <div class="mm-img-panel" data-panel="local">
      <input type="file" id="mmImageFile" accept="image/png,image/jpeg,image/jpg" hidden />
      <label class="mm-img-drop" id="mmImageDrop" for="mmImageFile">
        <div class="mm-img-drop-cta">
          <span class="mm-img-plus">+</span>
          <span>点击上传或拖拽图片到此处</span>
        </div>
        <div class="mm-img-drop-hint">支持 PNG / JPG 格式，单张图片不超过 2MB</div>
        <button class="mm-img-upload-btn" id="mmImageUploadBtn" type="button">选择文件</button>
      </label>
      <!-- 已选择文件预览（默认隐藏，选中后显示） -->
      <div class="mm-img-preview hidden" id="mmImagePreview">
        <img class="mm-img-preview-thumb" id="mmImagePreviewThumb" alt="" />
        <div class="mm-img-preview-info">
          <div class="mm-img-preview-name" id="mmImagePreviewName" title=""></div>
          <div class="mm-img-preview-meta" id="mmImagePreviewMeta"></div>
        </div>
        <button class="mm-img-preview-clear" id="mmImagePreviewClear" type="button" title="移除">✕</button>
      </div>
      <div class="mm-img-error hidden" id="mmImageLocalError"></div>
      <div class="mm-img-local-actions">
        <button class="mm-img-insert-btn" id="mmImageLocalOk" type="button" disabled>插入图片</button>
      </div>
    </div>

    <!-- Tab: 网络图片 -->
    <div class="mm-img-panel hidden" data-panel="web">
      <div class="mm-img-web-row">
        <input type="text" id="mmImageUrl" placeholder="粘贴图片链接地址" />
        <button class="mm-img-insert-btn" id="mmImageOk" type="button">插入图片</button>
      </div>
      <div class="mm-img-error hidden" id="mmImageWebError"></div>
    </div>

  </div>

  <!-- 图片放大预览（隐藏） -->
  <div class="mm-lightbox hidden" id="mmLightbox" role="dialog" aria-label="图片预览">
    <img id="mmLightboxImg" alt="" />
    <button class="mm-lightbox-delete" id="mmLightboxDelete" title="删除节点图片" aria-label="删除节点图片" type="button">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"></path></svg>
      <span>删除图片</span>
    </button>
    <button class="mm-lightbox-close" id="mmLightboxClose" title="关闭（Esc）">✕</button>
  </div>

  <!-- More functions 浮层（点击右侧 rail 上"更多功能"按钮显示） -->
  <div class="mm-mf-panel hidden" id="mmMoreFunctions" role="dialog" aria-label="更多功能">
    <div class="mm-mf-head">
      <div class="mm-mf-title">更多功能</div>
      <button class="mm-mf-close" id="mmMfClose" type="button" title="关闭" aria-label="关闭">✕</button>
    </div>
    <div class="mm-mf-desc">点击下方按钮，为当前节点添加链接或附件</div>
    <div class="mm-mf-list">
      <button class="mm-mf-item" data-mf="link" type="button">
        <span class="mm-mf-icon">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7L11.5 6.8"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1.5-1.5"/></svg>
        </span>
        <span class="mm-mf-name">链接</span>
        <span class="mm-mf-key" data-key-mac="⌘+K" data-key-win="Ctrl+K"></span>
      </button>
      <button class="mm-mf-item" data-mf="attachment" type="button">
        <span class="mm-mf-icon">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5l-8.5 8.5a5 5 0 1 1-7-7l9-9a3.5 3.5 0 1 1 5 5l-9 9a2 2 0 1 1-2.8-2.8L15.5 8"/></svg>
        </span>
        <span class="mm-mf-name">附件</span>
        <span class="mm-mf-key" data-key-mac="⌘+⇧+A" data-key-win="Ctrl+Shift+A"></span>
      </button>
    </div>
  </div>

  <!-- 链接快捷操作浮层（点击节点链接图标时显示） -->
  <div class="mm-link-popup hidden" id="mmLinkPopup" role="dialog" aria-label="链接操作">
    <span class="mm-link-popup-url" id="mmLinkPopupUrl" title=""></span>
    <button class="mm-link-popup-open" id="mmLinkPopupOpen" type="button">Open Link</button>
    <span class="mm-link-popup-sep"></span>
    <button class="mm-link-popup-icon" id="mmLinkPopupCopy" type="button" title="复制链接" aria-label="复制链接">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
    </button>
    <button class="mm-link-popup-icon" id="mmLinkPopupEdit" type="button" title="编辑链接" aria-label="编辑链接">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>
    </button>
    <button class="mm-link-popup-icon mm-link-popup-icon-danger" id="mmLinkPopupDelete" type="button" title="删除链接" aria-label="删除链接">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>
    </button>
  </div>
</div>
<!-- simple-mind-map UMD 离线 vendor，挂载点 window.simpleMindMap -->
<script nonce="${nonce}" src="${vendorScriptUri}"></script>
<script type="module" nonce="${nonce}" src="${scriptUri}"></script>
</body>
</html>
