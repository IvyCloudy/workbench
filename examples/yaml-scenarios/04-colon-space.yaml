# ============================================================================
# 场景 04：R4 · 冒号后缺少空格
# ----------------------------------------------------------------------------
# 期望：`key:value` → `key: value`。URL / 时间戳 / 已加引号的值都不应误报。
# 触发行：第 8-11 行、第 14-16 行 共 7 处
# ----------------------------------------------------------------------------
# 说明：由于 `key:value` 会让 YAML 库无法解析后续行（All mapping items must
#       start at the same column），本文件预期会出现较多级联 parse 错误；
#       修完 R4 后所有 parse 错误将自动消失（多轮迭代验证点）。
# ============================================================================
metadata:
  name:demo-name
  version:1.0
  desc:hello
  author:myron

server:
  host:localhost
  port:8080
  scheme:http

# 以下均为合法样例，不应误报"缺少空格"
links:
  homepage: "https://example.com/path?a=1"
  api: "http://api.example.com:8080/v1"
  timestamp: "2024-06-01T10:30:00Z"
  ratio: 3:4
