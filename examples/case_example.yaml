        - UI检查点1
        - UI检查点2
      api_expected:
        - API检查点1
        - API检查点2
      db_expected:
        - 数据库检查点1
        - 数据库检查点2
    - id: 2
      operation: 步骤名称2
      data:
        - 步骤数据1
        - 步骤数据2
      ui_expected:
        - UI检查点1
        - UI检查点2
      api_expected:
        - API检查点1
      db_expected:
        - 数据库检查点1
