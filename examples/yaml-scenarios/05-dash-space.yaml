# ============================================================================
# 场景 05：R8 · 序列短横线后缺少空格
# ----------------------------------------------------------------------------
# 期望：`-value` → `- value`；负数/减号/引号内不应误报。
# 触发行：tags 段第 7-9 行、steps 段第 13、15 行 共 5 处
# ============================================================================
tags:
  -foo
  -bar
  -baz
  - good

steps:
  -operation: click
    target: btn_ok
  -operation: input
    target: input_name

# 合法样例，不应误报
math:
  neg: -1
  minus: 10-3
  desc: "-value in quotes"
