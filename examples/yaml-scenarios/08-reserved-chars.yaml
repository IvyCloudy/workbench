# ============================================================================
# 场景 08：R7 · 值中包含 YAML 保留字符
# ----------------------------------------------------------------------------
# 期望：裸值中出现 { } [ ] , & * ! > | 时命中 R7；引号内不应报警。
# 修复策略：给整个值加双引号。
# ============================================================================
brace:
  a: {a:1,b:2}
  b: a{b}c
bracket:
  a: [ci, dev]
  b: a[b]c
anchor:
  a: &anchor_name
  b: *anchor_name
tag:
  a: !CustomTag
block:
  a: > this is folded
  b: | with pipe
comma_pipe_amp:
  a: a,b,c
  b: a|b
  c: a&b
  d: a>b
  e: a*b
  f: a!b

# 已加引号，不应误报
ok:
  a: "{a:1,b:2}"
  b: "[ci, dev]"
  c: "&literal"
  d: "a,b,c"
