# ============================================================================
# 综合大规模 YAML 问题样例（用于验证分批修复：batchSize=100，>20 批）
# ---------------------------------------------------------------------------
# 目标问题量：> 2000
# 由 examples/gen-mega-yaml.mjs 自动生成，勿手工修改
# ============================================================================

# ---------- Section 1: Tab 相关边界 ----------
tab_cases:
  # 1.1 值末尾一个 Tab —— 触发 R2 且可能干扰下一行结构
  end_tab_1: value1
  end_tab_2: value2
  end_tab_3: value3
  # 1.2 值中间夹 Tab —— R2
  mid_tab_1: hello world
  mid_tab_2: foo bar baz
  # 1.3 冒号后紧跟 Tab（等价于缺空格 + 内联 Tab）
  after_colon_tab_1: value
  after_colon_tab_2: another
  # 1.4 值末连续多个 Tab
  multi_end_tab: end
  # 1.5 Tab 缩进（R1，命中即 stop 其他规则）
  tab_indent_1: v
  tab_indent_2: v
  tab_indent_3: v

# ---------- Section 2: 各规则典型示例 ----------
typical:
  name: "hello                    # R4 冒号后缺空格"
  # [indent mismatch] desc: my #note                # R6 值中 # 会被丢弃
  # [indent mismatch] enabled: yes                  # R5 歧义布尔
  # [indent mismatch] disabled: off                 # R5 歧义布尔
  # [indent mismatch] ratio: NaN                    # R5 特殊数值
  # [indent mismatch] fallback: null                # R5 null
  # [indent mismatch] body: {a:1,b:2}               # R7 { }
  # [indent mismatch] tags: [ci, dev]               # R7 [ ]
  # [indent mismatch] ref_val: a&b                  # R7 &
  # [indent mismatch] ptr_val: a*b                  # R7 *
  # [indent mismatch] bang_val: a!b                 # R7 !
  # [indent mismatch] gt_val: a>b                   # R7 >
  # [indent mismatch] pipe_val: a|b                 # R7 |
  # [indent mismatch] comma_val: a,b,c              # R7 ,
  # [indent mismatch] trailing_ws: hi   
  # [indent mismatch] ends_with_ws2: bye    

list_bad_dash:
  - foo                          # R8
  # [indent mismatch] -bar                          # R8
  - baz                          # R8
  - good

# ---------- Section 3: 重复 key ----------
dup_root:
  a: 1
  # [duplicate key removed] a: 2                          # F1 dup
  b: 3
  # [duplicate key removed] b: 4                          # F1 dup
  # [duplicate key removed] b: 5                          # F1 dup
nested_dup:
  inner:
    x: 1
    # [duplicate key removed] x: 2                        # F1 dup
    y: 3
    # [duplicate key removed] y: 4                        # F1 dup
seq_dup_items:
  - k: 1
    # [duplicate key removed] k: 2                        # F1 dup（sequence 同一 item 内）
  - k: 3
    # [duplicate key removed] k: 4                        # F1 dup（sequence 同一 item 内）
# 下面这段属于合法：sequence 不同 item 的同名 key，不应报警
seq_ok_items:
  - operation: a
    target: t1
  - operation: b
    target: t2

# ---------- Section 4: 未闭合引号 → parse error 级联 ----------
broken_zone:
  bad_string: "this quote never closes and eats the rest"
  next_key_1: "value_a           # 被上一行吞掉"
  next_key_2: "value_b           # 级联 error"
  nested_layer:
    deep_1: 1
    deep_2: 2
    dup_in_broken: x
    # [duplicate key removed] dup_in_broken: y            # F1（若还能识别）

